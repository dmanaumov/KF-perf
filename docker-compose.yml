# Dokploy: Compose-проект. Домен вешается на сервис "app", порт 3000.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-perf}:${POSTGRES_PASSWORD}@perf-db:5432/${POSTGRES_DB:-perf}
      PORT: 3000
    depends_on:
      perf-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  perf-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-perf}
      POSTGRES_USER: ${POSTGRES_USER:-perf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - perf-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-perf} -d ${POSTGRES_DB:-perf}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  perf-db-data:
